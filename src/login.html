<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подключение аккаунта · Gift Tracker</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101923;color:#edf4f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,480px);padding:32px;background:#192735;border:1px solid #344556;border-radius:20px}small{color:#8bcad9;letter-spacing:.08em}h1{font-size:26px;margin:12px 0}p{line-height:1.6;color:#b8c9d6}label{display:block;margin:24px 0 8px}input,button{width:100%;min-height:48px;border-radius:10px;font:inherit}input{background:#101923;color:inherit;border:1px solid #698397;padding:12px}button{margin-top:16px;border:0;background:#8bd5e5;color:#10212c;font-weight:650;cursor:pointer}button.secondary{background:transparent;color:#cadbe6;border:1px solid #536979}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:3px solid #ffda7b;outline-offset:3px}#status{white-space:pre-line}#error{color:#ffb4ab;white-space:pre-line}footer{margin-top:24px;font-size:13px;color:#a3b5c4;line-height:1.5}
</style>
<main><small>GIFT TRACKER / АДМИНИСТРАТОР</small><h1>Подключить аккаунт</h1><p id="status" role="status" aria-live="polite">Шаг 1 из 3. Введите номер аккаунта Telegram.</p><form id="form"><label id="label" for="value">Номер телефона</label><input id="value" type="tel" autocomplete="off" placeholder="+79991234567" required><p id="error" role="alert"></p><button id="submit">Получить код</button></form><button id="cancel" class="secondary">Отменить подключение</button><footer>Форма работает локально на этом компьютере. Код и пароль передаются напрямую процессу подключения, без отправки сообщениями в Telegram и без записи в базу бота. Ссылка действует 5 минут.</footer></main>
<script>
let token=location.hash.slice(1);history.replaceState(null,'','/');
const form=document.querySelector('#form'),input=document.querySelector('#value'),status=document.querySelector('#status'),error=document.querySelector('#error'),submit=document.querySelector('#submit'),label=document.querySelector('#label'),cancel=document.querySelector('#cancel');
if(!token){form.hidden=true;cancel.hidden=true;error.textContent='Откройте персональную ссылку из админ-панели бота.'}
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось выполнить запрос.');return data}
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;cancel.disabled=true;error.textContent='';const value=input.value;input.value='';try{const d=await request('/input',{value});status.textContent=d.message;if(d.stage==='code'){label.textContent='Код входа';input.type='text';input.placeholder='Код из Telegram или SMS';submit.textContent='Подтвердить код'}else if(d.stage==='password'){label.textContent='Пароль двухэтапной защиты';input.type='password';input.placeholder='Пароль 2FA';submit.textContent='Подключить'}else if(d.stage==='done'){token='';form.hidden=true;cancel.hidden=true;status.textContent='Аккаунт подключён. Вернитесь в админ-панель бота. Это окно можно закрыть.'}input.focus()}catch(e){error.textContent=e.message}finally{submit.disabled=false;cancel.disabled=false}});
cancel.addEventListener('click',async()=>{cancel.disabled=true;try{await request('/cancel',{});token='';form.hidden=true;cancel.hidden=true;status.textContent='Подключение отменено.'}catch(e){error.textContent=e.message;cancel.disabled=false}});
</script></html>
